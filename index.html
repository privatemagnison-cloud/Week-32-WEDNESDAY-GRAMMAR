<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary and Grammar Week 32 Review</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gray: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #86efac;
            --correct-text: #166534;
            --incorrect-bg: #fef2f2;
            --incorrect-border: #fca5a5;
            --incorrect-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px 10px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Disclaimer Banner */
        .warning-banner {
            background-color: #fef3c7;
            border-left: 6px solid #f59e0b;
            color: #92400e;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        /* Header Info */
        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .field-group input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .field-group input:focus {
            border-color: var(--primary);
        }

        /* Score Banner */
        #score-banner {
            display: none;
            background: #eff6ff;
            border: 2px solid #93c5fd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        #score-banner h2 {
            font-size: 1.5rem;
            color: #1e40af;
        }

        /* Section Styling */
        .section-box {
            margin-bottom: 35px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            background-color: #fff;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        /* Word Bank */
        .word-bank {
            background-color: #f1f5f9;
            border: 1px dashed #94a3b8;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            color: #334155;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .word-bank-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }

        /* Question Item */
        .question-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f5f9;
        }

        .question-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .question-header {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            display: none;
        }

        .status-badge.correct {
            display: inline-block;
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .status-badge.incorrect {
            display: inline-block;
            background-color: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid var(--incorrect-border);
        }

        /* Inputs & Options */
        .options-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background: #f1f5f9;
        }

        input[type="text"], select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            width: 100%;
            max-width: 380px;
            outline: none;
            margin-top: 5px;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        /* Feedback Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background-color: var(--incorrect-bg);
            border: 1px solid var(--incorrect-border);
            border-radius: 6px;
            color: var(--incorrect-text);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .explanation-box p {
            margin-bottom: 4px;
        }

        .explanation-box p:last-child {
            margin-bottom: 0;
        }

        /* Submit Button */
        .submit-btn {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Disclaimer Banner -->
    <div class="warning-banner">
        ⚠️ SAMPLE QUESTION REVIEW ONLY — THIS IS NOT AN OFFICIAL TEST
    </div>

    <!-- Header Section -->
    <header>
        <h1>VOCABULARY AND GRAMMAR WEEK 32</h1>
        <div class="header-fields">
            <div class="field-group">
                <label for="student-name">Student Name</label>
                <input type="text" id="student-name" placeholder="Enter your full name">
            </div>
            <div class="field-group">
                <label for="practice-date">Date</label>
                <input type="text" id="practice-date" readonly>
            </div>
        </div>
    </header>

    <!-- Results Banner -->
    <div id="score-banner">
        <h2 id="score-text">Practice Score: 0 / 25 - 0%</h2>
    </div>

    <!-- Practice Form -->
    <form id="quiz-form">
        <div id="quiz-container"></div>
        <button type="button" class="submit-btn" onclick="gradeQuiz()">Submit Practice Review</button>
    </form>
</div>

<script>
// Master Questions Data Source strictly based on Week 32 Vocabulary & Active/Passive Voice Lesson
const rawQuestions = [
    // PART A: Multiple Choice (Q1–Q10)
    {
        id: 1,
        part: 'A',
        type: 'mc',
        question: "A company discovered that its sensitive client financial records were leaked online. To prevent future unauthorized intrusions, the IT security team installed a strong ________.",
        options: ["firewall", "glitch", "landfill", "spam"],
        answer: "firewall",
        explanation: "A firewall is a security system designed to block unauthorized access to a computer network."
    },
    {
        id: 2,
        part: 'A',
        type: 'mc',
        question: "The town mayor announced that hunting and tree cutting are strictly illegal in the designated ________ to protect rare local bird species.",
        options: ["conservation area", "digital footprint", "bandwidth", "database"],
        answer: "conservation area",
        explanation: "A conservation area is a protected place where natural habitats and wildlife are preserved."
    },
    {
        id: 3,
        part: 'A',
        type: 'mc',
        question: "When converting the active sentence 'The chef cooked the meal' into passive voice, which of the following is the correct structure?",
        options: ["The meal was cooked by the chef.", "The meal cooked by the chef.", "The chef was cooked the meal.", "The meal is cook by chef."],
        answer: "The meal was cooked by the chef.",
        explanation: "Simple past active ('cooked') changes to simple past passive ('was cooked') with the object becoming the new subject."
    },
    {
        id: 4,
        part: 'A',
        type: 'mc',
        question: "Because plastic bags take hundreds of years to decompose, the supermarket replaced them with ________ bags made of plant materials.",
        options: ["biodegradable", "toxic", "wasteful", "virtual"],
        answer: "biodegradable",
        explanation: "Biodegradable materials are capable of breaking down naturally without causing harm to the environment."
    },
    {
        id: 5,
        part: 'A',
        type: 'mc',
        question: "During high-volume usage hours, workers noticed that their video conference kept freezing because the internet line lacked sufficient ________.",
        options: ["bandwidth", "overpopulation", "erosion", "extinction"],
        answer: "bandwidth",
        explanation: "Bandwidth refers to the maximum amount of data that can be transmitted over an internet connection."
    },
    {
        id: 6,
        part: 'A',
        type: 'mc',
        question: "In the passive sentence 'The new bridge was built by the construction crew last year,' what function does 'the construction crew' serve?",
        options: ["The agent", "The main verb", "The indirect object", "The active verb"],
        answer: "The agent",
        explanation: "In passive voice sentences, the doer of the action is referred to as the agent, usually introduced by 'by'."
    },
    {
        id: 7,
        part: 'A',
        type: 'mc',
        question: "The factory owner received a heavy penalty from the city after dumping ________ chemical waste directly into the local river.",
        options: ["toxic", "renewable", "viral", "wireless"],
        answer: "toxic",
        explanation: "Toxic describes substances that are poisonous, dangerous, or harmful to living organisms."
    },
    {
        id: 8,
        part: 'A',
        type: 'mc',
        question: "To protect user logins and credit card details from cybercriminals, the bank site converts all plain text into coded language using ________.",
        options: ["encryption", "deforestation", "glitch", "landfill"],
        answer: "encryption",
        explanation: "Encryption is the process of encoding information into a secure form to prevent unauthorized access."
    },
    {
        id: 9,
        part: 'A',
        type: 'mc',
        question: "Identify the correct passive voice transformation of the active sentence: 'They have completed the project.'",
        options: ["The project has been completed by them.", "The project was completed by them.", "The project is being completed by them.", "The project will be completed by them."],
        answer: "The project has been completed by them.",
        explanation: "Present perfect active ('have completed') becomes present perfect passive ('has been completed')."
    },
    {
        id: 10,
        part: 'A',
        type: 'mc',
        question: "Heavy rains on the deforested hillsides caused severe soil ________, washing tonnes of earth into the valley below.",
        options: ["erosion", "automation", "interface", "sustainability"],
        answer: "erosion",
        explanation: "Erosion is the gradual wearing away and destruction of land or soil by natural forces like wind or water."
    },

    // PART B: Fill in the Blank (Q11–Q15)
    {
        id: 11,
        part: 'B',
        type: 'text',
        question: "A sneaky program called ________ infected several office computers after an employee opened a suspicious email attachment.",
        answer: "malware",
        explanation: "Malware refers to software designed specifically to damage, disrupt, or gain unauthorized access to computer systems."
    },
    {
        id: 12,
        part: 'B',
        type: 'text',
        question: "Solar panels and wind turbines produce clean energy from a ________ source that naturally replenishes itself.",
        answer: "renewable",
        explanation: "Renewable energy comes from natural resources that are naturally replaced and used repeatedly."
    },
    {
        id: 13,
        part: 'B',
        type: 'text',
        question: "A minor software ________ caused the payment gateway to fail temporarily during the online holiday sale.",
        answer: "glitch",
        explanation: "A glitch is a small, temporary technical fault or error in hardware or software."
    },
    {
        id: 14,
        part: 'B',
        type: 'text',
        question: "Massive trees are cleared daily in rainforests, making large-scale ________ a major cause of animal habitat loss.",
        answer: "deforestation",
        explanation: "Deforestation is the large-scale cutting down or clearing of trees and forests."
    },
    {
        id: 15,
        part: 'B',
        type: 'text',
        question: "Many automated factories rely on complex computer systems that utilize ________ intelligence to make operational decisions.",
        answer: "artificial",
        explanation: "Artificial intelligence refers to machines or systems programmed to perform tasks requiring human intelligence."
    },

    // PART C: Match the Definition (Q16–Q20)
    {
        id: 16,
        part: 'C',
        type: 'match',
        definition: "The variety of plant and animal life in a particular natural environment or ecosystem",
        answer: "Biodiversity",
        explanation: "Biodiversity measures the variety and richness of species living within a specific ecological region."
    },
    {
        id: 17,
        part: 'C',
        type: 'match',
        definition: "A system or platform that allows a human user to interact directly with a computer program",
        answer: "Interface",
        explanation: "An interface is the point or layout where a human user interacts with a hardware or software system."
    },
    {
        id: 18,
        part: 'C',
        type: 'match',
        definition: "A set of step-by-step rules or instructions followed by a computer to solve a problem",
        answer: "Algorithm",
        explanation: "An algorithm is a formal set of mathematical rules or step-by-step procedures executed by computers."
    },
    {
        id: 19,
        part: 'C',
        type: 'match',
        definition: "The permanent complete disappearance of a biological species from the planet",
        answer: "Extinction",
        explanation: "Extinction occurs when the last living individual of a plant or animal species dies out completely."
    },
    {
        id: 20,
        part: 'C',
        type: 'match',
        definition: "The practice of using remote servers on the internet to store, manage, and process data",
        answer: "Cloud computing",
        explanation: "Cloud computing allows users and businesses to store and access data over remote internet servers."
    },

    // PART D: Sentence Completion (Q21–Q25)
    {
        id: 21,
        part: 'D',
        type: 'text',
        question: "Active context: 'The students clean the classroom daily.' -> Passive: 'The classroom is ________ daily by the students.'",
        answer: "cleaned",
        explanation: "In simple present passive voice ('is + past participle'), the verb 'clean' becomes 'cleaned'."
    },
    {
        id: 22,
        part: 'D',
        type: 'text',
        question: "Active context: 'The malicious hacker stole the company records.' -> Passive: 'The company records were ________ by the malicious hacker.'",
        answer: "stolen",
        explanation: "The past participle of the irregular verb 'steal' required in passive voice is 'stolen'."
    },
    {
        id: 23,
        part: 'D',
        type: 'text',
        question: "Active context: 'The courier will deliver the package tomorrow.' -> Passive: 'The package will be ________ tomorrow by the courier.'",
        answer: "delivered",
        explanation: "Future simple passive construction uses 'will be + past participle' ('delivered')."
    },
    {
        id: 24,
        part: 'D',
        type: 'text',
        question: "Active context: 'The workers are painting the wall right now.' -> Passive: 'The wall is being ________ right now by the workers.'",
        answer: "painted",
        explanation: "Present continuous passive uses 'is/are being + past participle' ('painted')."
    },
    {
        id: 25,
        part: 'D',
        type: 'text',
        question: "Active context: 'Maria wrote the weekly progress report.' -> Passive: 'The weekly progress report was ________ by Maria.'",
        answer: "written",
        explanation: "The past participle form of the irregular verb 'write' in simple past passive is 'written'."
    }
];

// Utility: Fisher-Yates Shuffle Algorithm
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Global variable tracking randomized questions order
let quizState = [];

// Auto-fill Current Date
document.getElementById('practice-date').value = new Date().toLocaleDateString('en-US', {
    year: 'numeric',
    month: 'long',
    day: 'numeric'
});

// Render Application Dynamically on Page Load
function initQuiz() {
    const quizContainer = document.getElementById('quiz-container');
    quizContainer.innerHTML = '';

    // Grouping Questions by Parts & Shuffling Question Order independently
    const partA = shuffleArray(rawQuestions.filter(q => q.part === 'A'));
    const partB = shuffleArray(rawQuestions.filter(q => q.part === 'B'));
    const partC = shuffleArray(rawQuestions.filter(q => q.part === 'C'));
    const partD = shuffleArray(rawQuestions.filter(q => q.part === 'D'));

    quizState = [...partA, ...partB, ...partC, ...partD];

    // Section Definitions
    const sections = [
        {
            title: "Part A: Multiple Choice Questions",
            questions: partA,
            renderHeader: null
        },
        {
            title: "Part B: Fill in the Blank",
            questions: partB,
            renderHeader: () => {
                const words = shuffleArray(partB.map(q => q.answer));
                return `<div class="word-bank"><span class="word-bank-title">Word Bank</span>${words.join(' • ')}</div>`;
            }
        },
        {
            title: "Part C: Match the Definition",
            questions: partC,
            renderHeader: null
        },
        {
            title: "Part D: Sentence Completion (Passive Voice)",
            questions: partD,
            renderHeader: () => {
                const words = shuffleArray(partD.map(q => q.answer));
                return `<div class="word-bank"><span class="word-bank-title">Word Bank</span>${words.join(' • ')}</div>`;
            }
        }
    ];

    // Build Form UI
    sections.forEach(sec => {
        const secBox = document.createElement('div');
        secBox.className = 'section-box';
        
        let html = `<div class="section-title">${sec.title}</div>`;
        if (sec.renderHeader) html += sec.renderHeader();

        // Shuffled Matching Pool for Part C Dropdowns
        let partCOptions = [];
        if (sec.title.includes("Part C")) {
            partCOptions = shuffleArray(partC.map(q => q.answer));
        }

        sec.questions.forEach((q) => {
            const displayNum = quizState.findIndex(item => item.id === q.id) + 1;
            
            html += `<div class="question-item" id="q-box-${q.id}">
                <div class="question-header">
                    <span>${displayNum}. ${q.type === 'match' ? q.definition : q.question}</span>
                    <span class="status-badge" id="badge-${q.id}"></span>
                </div>`;

            if (q.type === 'mc') {
                const shuffledOpts = shuffleArray(q.options);
                html += `<div class="options-group">`;
                shuffledOpts.forEach(opt => {
                    html += `<label class="option-label">
                        <input type="radio" name="q-${q.id}" value="${opt}">
                        <span>${opt}</span>
                    </label>`;
                });
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" name="q-${q.id}" placeholder="Type your answer here..." autocomplete="off">`;
            } else if (q.type === 'match') {
                html += `<select name="q-${q.id}">
                    <option value="">-- Select Vocabulary Word --</option>`;
                partCOptions.forEach(opt => {
                    html += `<option value="${opt}">${opt}</option>`;
                });
                html += `</select>`;
            }

            // Explanation box (Hidden by default)
            html += `<div class="explanation-box" id="exp-${q.id}"></div></div>`;
        });

        secBox.innerHTML = html;
        quizContainer.appendChild(secBox);
    });
}

// Grading Functionality
function gradeQuiz() {
    let score = 0;
    const total = quizState.length;

    quizState.forEach(q => {
        const badge = document.getElementById(`badge-${q.id}`);
        const expBox = document.getElementById(`exp-${q.id}`);
        let userAns = "";

        // Collect student responses
        if (q.type === 'mc') {
            const selected = document.querySelector(`input[name="q-${q.id}"]:checked`);
            userAns = selected ? selected.value.trim() : "";
        } else if (q.type === 'text') {
            const input = document.querySelector(`input[name="q-${q.id}"]`);
            userAns = input ? input.value.trim() : "";
        } else if (q.type === 'match') {
            const select = document.querySelector(`select[name="q-${q.id}"]`);
            userAns = select ? select.value.trim() : "";
        }

        // Case-Insensitive & Trim Validation
        const isCorrect = userAns.toLowerCase() === q.answer.toLowerCase();

        if (isCorrect) {
            score++;
            badge.className = "status-badge correct";
            badge.innerText = "✓ Correct";
            
            // Cleanly hide explanation box on correct answers
            expBox.style.display = "none";
            expBox.innerHTML = "";
        } else {
            badge.className = "status-badge incorrect";
            badge.innerText = "X Incorrect";

            // Render detailed explanation box for incorrect or unattempted questions
            const displaySubmitted = userAns === "" ? "<em>No answer provided</em>" : `<strong>${userAns}</strong>`;
            expBox.innerHTML = `
                <p><strong>Your Answer:</strong> ${displaySubmitted}</p>
                <p><strong>Correct Answer:</strong> <strong>${q.answer}</strong></p>
                <p><strong>Explanation:</strong> ${q.explanation}</p>
            `;
            expBox.style.display = "block";
        }
    });

    // Score Calculation & Banner Display
    const percentage = Math.round((score / total) * 100);
    const scoreBanner = document.getElementById('score-banner');
    const scoreText = document.getElementById('score-text');
    
    scoreText.innerText = `Practice Score: ${score} / ${total} - ${percentage}%`;
    scoreBanner.style.display = "block";

    // Scroll smoothly to score banner
    scoreBanner.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Initialize application on window load
window.onload = initQuiz;
</script>

</body>
</html>

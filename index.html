<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Practice Review</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gray: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct-bg: #dcfce7;
            --correct-border: #86efac;
            --correct-text: #166534;
            --incorrect-bg: #fef2f2;
            --incorrect-border: #fca5a5;
            --incorrect-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px 10px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Disclaimer Banner */
        .warning-banner {
            background-color: #fef3c7;
            border-left: 6px solid #f59e0b;
            color: #92400e;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        /* Header Info */
        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        .field-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .field-group input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .field-group input:focus {
            border-color: var(--primary);
        }

        /* Score Banner */
        #score-banner {
            display: none;
            background: #eff6ff;
            border: 2px solid #93c5fd;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        #score-banner h2 {
            font-size: 1.5rem;
            color: #1e40af;
        }

        /* Section Styling */
        .section-box {
            margin-bottom: 35px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            background-color: #fff;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        /* Word Bank */
        .word-bank {
            background-color: #f1f5f9;
            border: 1px dashed #94a3b8;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            color: #334155;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .word-bank-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }

        /* Question Item */
        .question-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f5f9;
        }

        .question-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .question-header {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            display: none;
        }

        .status-badge.correct {
            display: inline-block;
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .status-badge.incorrect {
            display: inline-block;
            background-color: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid var(--incorrect-border);
        }

        /* Inputs & Options */
        .options-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background: #f1f5f9;
        }

        input[type="text"], select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            width: 100%;
            max-width: 380px;
            outline: none;
            margin-top: 5px;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        /* Feedback Explanation Box */
        .explanation-box {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background-color: var(--incorrect-bg);
            border: 1px solid var(--incorrect-border);
            border-radius: 6px;
            color: var(--incorrect-text);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .explanation-box p {
            margin-bottom: 4px;
        }

        .explanation-box p:last-child {
            margin-bottom: 0;
        }

        /* Submit Button */
        .submit-btn {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Disclaimer Banner -->
    <div class="warning-banner">
        ⚠️ SAMPLE QUESTION REVIEW ONLY — THIS IS NOT AN OFFICIAL TEST
    </div>

    <!-- Header Section -->
    <header>
        <h1>VOCABULARY PRACTICE REVIEW</h1>
        <div class="header-fields">
            <div class="field-group">
                <label for="student-name">Student Name</label>
                <input type="text" id="student-name" placeholder="Enter your full name">
            </div>
            <div class="field-group">
                <label for="practice-date">Date</label>
                <input type="text" id="practice-date" readonly>
            </div>
        </div>
    </header>

    <!-- Results Banner -->
    <div id="score-banner">
        <h2 id="score-text">Practice Score: 0 / 25 - 0%</h2>
    </div>

    <!-- Practice Form -->
    <form id="quiz-form">
        <div id="quiz-container"></div>
        <button type="button" class="submit-btn" onclick="gradeQuiz()">Submit Practice Review</button>
    </form>
</div>

<script>
// Master Data Source (25 Situational Grammar Questions on Collocations & Active/Passive Voice)
const rawQuestions = [
    // PART A: Multiple Choice (Q1–Q10) - Situational Collocations & Passive Voice
    {
        id: 1,
        part: 'A',
        type: 'mc',
        question: "During a busy seminar, the speaker asked everyone to ________ while key instructions were being explained.",
        options: ["pay attention", "make attention", "take attention", "do attention"],
        answer: "pay attention",
        explanation: "In English collocations, we 'pay attention' to focus on someone or something."
    },
    {
        id: 2,
        part: 'A',
        type: 'mc',
        question: "After studying continuously for four hours, Sarah decided to ________ before starting her practice exam.",
        options: ["take a break", "make a break", "do a break", "keep a break"],
        answer: "take a break",
        explanation: "The correct verb collocation for taking a rest or pause is 'take a break'."
    },
    {
        id: 3,
        part: 'A',
        type: 'mc',
        question: "The newly launched smartphone ________ by thousands of technology enthusiasts online every day.",
        options: ["is being reviewed", "is reviewing", "was review", "has reviewing"],
        answer: "is being reviewed",
        explanation: "The passive present continuous structure is 'is/are + being + past participle' (is being reviewed)."
    },
    {
        id: 4,
        part: 'A',
        type: 'mc',
        question: "Before submitting her career application, Maria went to her mentor to ________ about her resume.",
        options: ["take advice", "do advice", "give advice", "keep advice"],
        answer: "take advice",
        explanation: "When receiving guidance from someone else, the standard collocation is to 'take advice' (or seek advice)."
    },
    {
        id: 5,
        part: 'A',
        type: 'mc',
        question: "All commuters were delayed for over two hours on the highway because of a heavy ________.",
        options: ["traffic jam", "strong traffic", "traffic barrier", "traffic weather"],
        answer: "traffic jam",
        explanation: "A severe line-up of stopped or slow vehicle traffic is correctly called a 'traffic jam'."
    },
    {
        id: 6,
        part: 'A',
        type: 'mc',
        question: "The environmental NGO organized a public campaign to ________ regarding plastic pollution.",
        options: ["raise awareness", "make awareness", "give awareness", "take awareness"],
        answer: "raise awareness",
        explanation: "The standard professional collocation for spreading knowledge about an issue is to 'raise awareness'."
    },
    {
        id: 7,
        part: 'A',
        type: 'mc',
        question: "If you want to pass your weekly evaluations, you must ________ every evening before going to bed.",
        options: ["do your homework", "make your homework", "keep your homework", "give your homework"],
        answer: "do your homework",
        explanation: "Academic tasks and school assignments collocate with the verb 'do' (e.g., 'do your homework')."
    },
    {
        id: 8,
        part: 'A',
        type: 'mc',
        question: "Because the main server crashed unexpectedly, the monthly financial report ________ by the accounting team in time.",
        options: ["could not be completed", "could not complete", "was not complete by", "did not completed"],
        answer: "could not be completed",
        explanation: "Passive modal forms require 'modal + be + past participle' (could not be completed)."
    },
    {
        id: 9,
        part: 'A',
        type: 'mc',
        question: "During the solemn memorial ceremony, attendees ________ while listening to the final speech.",
        options: ["whispered softly", "argued softly", "whispered heavily", "listened softly"],
        answer: "whispered softly",
        explanation: "The natural verb-adverb collocation for speaking quietly in a respectful setting is 'whispered softly'."
    },
    {
        id: 10,
        part: 'A',
        type: 'mc',
        question: "The food critic gave five stars to the new bistro and said she would ________ it to all seafood lovers.",
        options: ["strongly recommend", "fully recommend", "seriously recommend", "deeply recommend"],
        answer: "strongly recommend",
        explanation: "The common adverb-verb collocation used to give an enthusiastic endorsement is 'strongly recommend'."
    },

    // PART B: Fill in the Blank (Q11–Q15) - Passive Voice Auxiliary Verbs
    {
        id: 11,
        part: 'B',
        type: 'text',
        question: "Active: 'The technician repaired the server.' -> Passive: 'The server ________ repaired by the technician.'",
        answer: "was",
        explanation: "Simple past active ('repaired') converts to simple past passive using 'was' for a singular subject ('server')."
    },
    {
        id: 12,
        part: 'B',
        type: 'text',
        question: "Active: 'The catering team will deliver the food.' -> Passive: 'The food will ________ delivered by the team.'",
        answer: "be",
        explanation: "Future simple passive uses the structure 'will + be + past participle' (will be delivered)."
    },

    {
        id: 13,
        part: 'B',
        type: 'text',
        question: "Active: 'The engineers have resolved the problem.' -> Passive: 'The problem has ________ resolved by the engineers.'",
        answer: "been",
        explanation: "Present perfect passive uses 'has/have + been + past participle' (has been resolved)."
    },
    {
        id: 14,
        part: 'B',
        type: 'text',
        question: "Active: 'The staff are cleaning the rooms.' -> Passive: 'The rooms are ________ cleaned by the staff.'",
        answer: "being",
        explanation: "Present continuous passive requires 'is/are + being + past participle' (are being cleaned)."
    },
    {
        id: 15,
        part: 'B',
        type: 'text',
        question: "Active: 'The chef prepares fresh meals.' -> Passive: 'Fresh meals ________ prepared daily by the chef.'",
        answer: "are",
        explanation: "Simple present passive for a plural subject ('meals') takes the auxiliary verb 'are' (are prepared)."
    },

    // PART C: Match the Definition (Q16–Q20) - Passive Voice Rules & Terms
    {
        id: 16,
        part: 'C',
        type: 'match',
        definition: "The noun or noun phrase that receives the action of a transitive verb in an active sentence",
        answer: "Direct Object",
        explanation: "The direct object receives the verb's action and becomes the subject when converted into a passive sentence."
    },
    {
        id: 17,
        part: 'C',
        type: 'match',
        definition: "The prepositional phrase (e.g., 'by the student') that identifies who or what performed the action in a passive sentence",
        answer: "Agent",
        explanation: "In passive voice, the doer of the action is introduced as the agent following the preposition 'by'."
    },
    {
        id: 18,
        part: 'C',
        type: 'match',
        definition: "The third principal form of a verb used in all passive voice verb combinations (e.g., eaten, written, built)",
        answer: "Past Participle",
        explanation: "All passive voice constructions require a form of 'be' combined with the main verb's past participle."
    },
    {
        id: 19,
        part: 'C',
        type: 'match',
        definition: "A verb sentence structure where the subject performs the action directly (e.g., 'The student completed the test')",
        answer: "Active Voice",
        explanation: "Active voice highlights the subject performing the action upon an object."
    },
    {
        id: 20,
        part: 'C',
        type: 'match',
        definition: "A verb sentence structure where the grammatical subject receives the action (e.g., 'The test was completed')",
        answer: "Passive Voice",
        explanation: "Passive voice focuses on the receiver of the action or the result of the action."
    },

    // PART D: Sentence Completion (Q21–Q25) - Contextual Past Participles
    {
        id: 21,
        part: 'D',
        type: 'text',
        question: "Situational context: 'The architect drew the blueprints yesterday.' -> Passive: 'The blueprints were ________ yesterday by the architect.'",
        answer: "drawn",
        explanation: "The past participle of the irregular verb 'draw' is 'drawn'."
    },
    {
        id: 22,
        part: 'D',
        type: 'text',
        question: "Situational context: 'The manager wrote a notice to all staff.' -> Passive: 'A notice was ________ to all staff by the manager.'",
        answer: "written",
        explanation: "The past participle of the irregular verb 'write' is 'written'."
    },
    {
        id: 23,
        part: 'D',
        type: 'text',
        question: "Situational context: 'A mysterious thief stole the artwork.' -> Passive: 'The artwork was ________ by a mysterious thief.'",
        answer: "stolen",
        explanation: "The past participle of the irregular verb 'steal' is 'stolen'."
    },
    {
        id: 24,
        part: 'D',
        type: 'text',
        question: "Situational context: 'The contractor built the new office facility.' -> Passive: 'The new office facility was ________ by the contractor.'",
        answer: "built",
        explanation: "The past participle of the irregular verb 'build' is 'built'."
    },
    {
        id: 25,
        part: 'D',
        type: 'text',
        question: "Situational context: 'The committee chose a new team leader.' -> Passive: 'A new team leader was ________ by the committee.'",
        answer: "chosen",
        explanation: "The past participle of the irregular verb 'choose' is 'chosen'."
    }
];

// Utility: Fisher-Yates Shuffle Algorithm
function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Master state storing dynamically rendered questions
let quizState = [];

// Auto-fill Current Date
document.getElementById('practice-date').value = new Date().toLocaleDateString('en-US', {
    year: 'numeric',
    month: 'long',
    day: 'numeric'
});

// Render Application Dynamically on Page Load
function initQuiz() {
    const quizContainer = document.getElementById('quiz-container');
    quizContainer.innerHTML = '';

    // Grouping Questions by Parts & Shuffling Question Order
    const partA = shuffleArray(rawQuestions.filter(q => q.part === 'A'));
    const partB = shuffleArray(rawQuestions.filter(q => q.part === 'B'));
    const partC = shuffleArray(rawQuestions.filter(q => q.part === 'C'));
    const partD = shuffleArray(rawQuestions.filter(q => q.part === 'D'));

    quizState = [...partA, ...partB, ...partC, ...partD];

    // Part Definitions
    const sections = [
        {
            title: "Part A: Multiple Choice (Collocations & Grammar)",
            questions: partA,
            renderHeader: null
        },
        {
            title: "Part B: Fill in the Blank (Passive Voice Auxiliary Verbs)",
            questions: partB,
            renderHeader: () => {
                const words = shuffleArray(partB.map(q => q.answer));
                return `<div class="word-bank"><span class="word-bank-title">Word Bank (Auxiliary Verbs)</span>${words.join(' • ')}</div>`;
            }
        },
        {
            title: "Part C: Match the Definition (Grammar Terms & Concepts)",
            questions: partC,
            renderHeader: null
        },
        {
            title: "Part D: Sentence Completion (Past Participles in Passive Voice)",
            questions: partD,
            renderHeader: () => {
                const words = shuffleArray(partD.map(q => q.answer));
                return `<div class="word-bank"><span class="word-bank-title">Word Bank (Past Participles)</span>${words.join(' • ')}</div>`;
            }
        }
    ];

    // Build Form UI
    sections.forEach(sec => {
        const secBox = document.createElement('div');
        secBox.className = 'section-box';
        
        let html = `<div class="section-title">${sec.title}</div>`;
        if (sec.renderHeader) html += sec.renderHeader();

        // Matching Options Pool for Part C Dropdowns
        let partCOptions = [];
        if (sec.title.includes("Part C")) {
            partCOptions = shuffleArray(partC.map(q => q.answer));
        }

        sec.questions.forEach((q) => {
            const displayNum = quizState.findIndex(item => item.id === q.id) + 1;
            
            html += `<div class="question-item" id="q-box-${q.id}">
                <div class="question-header">
                    <span>${displayNum}. ${q.type === 'match' ? q.definition : q.question}</span>
                    <span class="status-badge" id="badge-${q.id}"></span>
                </div>`;

            if (q.type === 'mc') {
                const shuffledOpts = shuffleArray(q.options);
                html += `<div class="options-group">`;
                shuffledOpts.forEach(opt => {
                    html += `<label class="option-label">
                        <input type="radio" name="q-${q.id}" value="${opt}">
                        <span>${opt}</span>
                    </label>`;
                });
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" name="q-${q.id}" placeholder="Type your answer here..." autocomplete="off">`;
            } else if (q.type === 'match') {
                html += `<select name="q-${q.id}">
                    <option value="">-- Select Matching Grammar Term --</option>`;
                partCOptions.forEach(opt => {
                    html += `<option value="${opt}">${opt}</option>`;
                });
                html += `</select>`;
            }

            // Explanation box (Hidden by default)
            html += `<div class="explanation-box" id="exp-${q.id}"></div></div>`;
        });

        secBox.innerHTML = html;
        quizContainer.appendChild(secBox);
    });
}

// Grading Functionality
function gradeQuiz() {
    let score = 0;
    const total = quizState.length;

    quizState.forEach(q => {
        const badge = document.getElementById(`badge-${q.id}`);
        const expBox = document.getElementById(`exp-${q.id}`);
        let userAns = "";

        // Collect student responses
        if (q.type === 'mc') {
            const selected = document.querySelector(`input[name="q-${q.id}"]:checked`);
            userAns = selected ? selected.value.trim() : "";
        } else if (q.type === 'text') {
            const input = document.querySelector(`input[name="q-${q.id}"]`);
            userAns = input ? input.value.trim() : "";
        } else if (q.type === 'match') {
            const select = document.querySelector(`select[name="q-${q.id}"]`);
            userAns = select ? select.value.trim() : "";
        }

        // Case-Insensitive & Trim Validation
        const isCorrect = userAns.toLowerCase() === q.answer.toLowerCase();

        if (isCorrect) {
            score++;
            badge.className = "status-badge correct";
            badge.innerText = "✓ Correct";
            
            // Cleanly hide explanation box on correct answers
            expBox.style.display = "none";
            expBox.innerHTML = "";
        } else {
            badge.className = "status-badge incorrect";
            badge.innerText = "X Incorrect";

            // Render detailed explanation box for incorrect or unattempted questions
            const displaySubmitted = userAns === "" ? "<em>No answer provided</em>" : `<strong>${userAns}</strong>`;
            expBox.innerHTML = `
                <p><strong>Your Answer:</strong> ${displaySubmitted}</p>
                <p><strong>Correct Answer:</strong> <strong>${q.answer}</strong></p>
                <p><strong>Explanation:</strong> ${q.explanation}</p>
            `;
            expBox.style.display = "block";
        }
    });

    // Score Calculation & Banner Update
    const percentage = Math.round((score / total) * 100);
    const scoreBanner = document.getElementById('score-banner');
    const scoreText = document.getElementById('score-text');
    
    scoreText.innerText = `Practice Score: ${score} / ${total} - ${percentage}%`;
    scoreBanner.style.display = "block";

    // Scroll smoothly to score banner
    scoreBanner.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Initialize quiz structure on window load
window.onload = initQuiz;
</script>

</body>
</html>
